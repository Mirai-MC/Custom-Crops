name: Build and release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v3.6.57"
        required: true
        type: string
      release_name:
        description: "Release title (defaults to the tag)"
        required: false
        type: string
      prerelease:
        description: "Mark as a pre-release"
        required: true
        default: false
        type: boolean
      draft:
        description: "Create as a draft"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew clean build

      - name: Locate release JAR
        id: artifact
        shell: bash
        run: |
          shopt -s nullglob
          jars=(target/CustomCrops-*.jar)
          if (( ${#jars[@]} != 1 )); then
            echo "Expected exactly one CustomCrops JAR in target/, found ${#jars[@]}" >&2
            exit 1
          fi
          echo "path=${jars[0]}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_NAME: ${{ inputs.release_name }}
          PRERELEASE: ${{ inputs.prerelease }}
          DRAFT: ${{ inputs.draft }}
          ARTIFACT: ${{ steps.artifact.outputs.path }}
        run: |
          title="${RELEASE_NAME:-$RELEASE_TAG}"
          args=(release create "$RELEASE_TAG" "$ARTIFACT" --target "$GITHUB_SHA" --title "$title" --generate-notes)
          [[ "$PRERELEASE" == "true" ]] && args+=(--prerelease)
          [[ "$DRAFT" == "true" ]] && args+=(--draft)
          gh "${args[@]}"
